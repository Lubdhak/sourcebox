# Production-oriented composition.
#
# NOT the development workflow. `./dev` mounts your working tree over the image, runs a Vite
# dev server and enables code reloading; none of that belongs in production.
#
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#
# Three application images, each independently deployable:
#
#   frontend  nginx + hashed assets.        No Ruby, no database, no backend dependency.
#                                           Scales with asset traffic, or is replaced by a
#                                           CDN outright.
#   backend   Rails: HTML + GraphQL.        No Node, no JavaScript toolchain.
#                                           Scales with request traffic.
#   worker    Solid Queue.                  Scales with job backlog.
#
# `backend` and `worker` share one image and differ only by command, so a deploy cannot run
# mismatched code in the request path and the queue.
#
# The backend discovers the frontend build by fetching ASSET_HOST/manifest.json at runtime,
# so the two images share no volume and no filesystem -- only a URL.
#
# Postgres is included so the stack is runnable locally for verification. In a real
# deployment use managed Postgres and delete that service.

name: sourcebox-prod

x-backend-image: &backend-image
  image: sourcebox-backend:${APP_VERSION:-latest}
  build:
    context: ./backend
    target: production
    args:
      RUBY_VERSION: "3.4.10"

x-backend-env: &backend-env
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "1"
  RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}

  # Where the browser loads assets from, and where the backend fetches manifest.json.
  # In a real deployment this is your CDN or public asset domain.
  ASSET_HOST: ${ASSET_HOST:-http://frontend:8080}

  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB:-sourcebox}
  POSTGRES_USER: ${POSTGRES_USER:-sourcebox_dev}

  # `:?` fails the command with a clear message instead of starting a container that is
  # broken in a subtler way later.
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}

  # SSL terminates at the load balancer in front of this stack.
  RAILS_ASSUME_SSL: "1"

services:
  # --- FE: independently deployable static assets -----------------------
  frontend:
    image: sourcebox-frontend:${APP_VERSION:-latest}
    build:
      context: ./frontend
      target: production
    # No depends_on and no environment: it serves files. It keeps serving the previous
    # release's assets even while the backend or database is down, which is what makes
    # independent deploys safe.
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    restart: unless-stopped
    # nginx needs no write access to its own filesystem.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz" ]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- BE ---------------------------------------------------------------
  backend:
    <<: *backend-image
    command: [ "bin/rails", "server", "-b", "0.0.0.0", "-p", "3000" ]
    environment: *backend-env
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      # Required here, unlike in development: the backend fetches manifest.json from the
      # frontend on its first render, so the asset host must be up.
      frontend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Readiness, not liveness: behind a load balancer an instance with a broken database
      # connection should be pulled from rotation.
      test: [ "CMD", "ruby", "-e", "require 'net/http'; exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/ready')).code == '200' ? 0 : 1)" ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # --- Worker -----------------------------------------------------------
  worker:
    <<: *backend-image
    command: [ "bin/jobs" ]
    environment:
      <<: *backend-env
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-2}
      JOB_CONCURRENCY_CRITICAL: ${JOB_CONCURRENCY_CRITICAL:-1}
    # No ports, and no dependency on the frontend: a worker renders no HTML.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD", "bin/rails", "solid_queue:check" ]
      interval: 60s
      timeout: 15s
      start_period: 30s
      retries: 3

  # --- DB: replace with managed Postgres in a real deployment -----------
  postgres:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sourcebox}
      POSTGRES_USER: ${POSTGRES_USER:-sourcebox_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    # Not published: only the application containers need to reach the database.
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sourcebox_dev} -d ${POSTGRES_DB:-sourcebox}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
