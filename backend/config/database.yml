# PostgreSQL 18.
#
# Three databases on ONE PostgreSQL server:
#
#   primary -> application data (users, dashboards, the documentation graph)
#   queue   -> Solid Queue's 10 solid_queue_* tables
#   cable   -> Solid Cable's message table, which is pure churn: every realtime message
#              in a collaborative session lands there and is trimmed away again
#
# Why split them? Job churn is high-volume, short-lived write traffic. Keeping it
# out of the primary keeps autovacuum, WAL volume and backup size predictable,
# lets you truncate/restore the queue independently, and stops `db:migrate` on the
# primary from contending with worker polling locks. It is still one server, one
# set of credentials and zero Redis.
#
# Solid Queue 1.7 ships `db/queue_schema.rb` rather than engine migrations, and
# Rails resolves the schema file for a non-primary config named `queue` to exactly
# that path -- so `bin/rails db:prepare` creates and loads it with no extra work.
#
# See README.md for the single-database alternative.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", "sourcebox") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "sourcebox") %>

development:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "sourcebox_development") %>
  queue:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "sourcebox_development") %>_queue
    schema_dump: queue_schema.rb
  cable:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "sourcebox_development") %>_cable
    schema_dump: cable_schema.rb

# The test databases are derived with a `_test` suffix rather than read straight from
# POSTGRES_DB.
#
# They used to be `ENV.fetch("POSTGRES_DB", "sourcebox_test")`, which reads correctly but
# behaves badly: POSTGRES_DB is set in .env, so the fallback never applied and the test
# environment connected to the *development* database. `db:test:prepare` then tried to
# purge it, and the only thing that stopped it was Rails' protected-environments check
# aborting the task -- after which the suite quietly ran against development data.
test:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_TEST_DB") { "#{ENV.fetch('POSTGRES_DB', 'sourcebox')}_test" } %>
  queue:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_TEST_DB") { "#{ENV.fetch('POSTGRES_DB', 'sourcebox')}_test" } %>_queue
    schema_dump: queue_schema.rb
  cable:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_TEST_DB") { "#{ENV.fetch('POSTGRES_DB', 'sourcebox')}_test" } %>_cable
    schema_dump: cable_schema.rb

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "sourcebox_production") %>
  queue:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "sourcebox_production") %>_queue
    schema_dump: queue_schema.rb
  cable:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "sourcebox_production") %>_cable
    schema_dump: cable_schema.rb
