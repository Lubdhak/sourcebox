# PostgreSQL 18.
#
# Two databases on ONE PostgreSQL server:
#
#   primary -> application data (users, dashboards)
#   queue   -> Solid Queue's 10 solid_queue_* tables
#
# Why split them? Job churn is high-volume, short-lived write traffic. Keeping it
# out of the primary keeps autovacuum, WAL volume and backup size predictable,
# lets you truncate/restore the queue independently, and stops `db:migrate` on the
# primary from contending with worker polling locks. It is still one server, one
# set of credentials and zero Redis.
#
# Solid Queue 1.7 ships `db/queue_schema.rb` rather than engine migrations, and
# Rails resolves the schema file for a non-primary config named `queue` to exactly
# that path -- so `bin/rails db:prepare` creates and loads it with no extra work.
#
# See README.md for the single-database alternative.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", "sourcebox") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "sourcebox") %>

development:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "sourcebox_development") %>
  queue:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "sourcebox_development") %>_queue
    schema_dump: queue_schema.rb

test:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "sourcebox_test") %>
  queue:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "sourcebox_test") %>_queue
    schema_dump: queue_schema.rb

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "sourcebox_production") %>
  queue:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "sourcebox_production") %>_queue
    schema_dump: queue_schema.rb
