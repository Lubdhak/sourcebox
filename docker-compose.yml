# Local development stack. Started with `./dev` -- see that script for orchestration.
#
# Four containers, one per concern, each built from its own directory:
#
#   postgres   database/    PostgreSQL 18
#   backend    backend/     Rails: HTML shell, Inertia props, GraphQL
#   worker     backend/     Solid Queue (same image as backend, different command)
#   frontend   frontend/    Vite dev server
#
# backend/ and frontend/ have separate build contexts and separate Dockerfiles. Neither
# references anything outside its own directory, so either can be lifted into its own
# repository without edits. This file is the only place that knows they belong together.
#
# This is the DEVELOPMENT composition: source is bind-mounted and Vite runs a dev server.
# Hot reload is off by default (FRONTEND_HOT_RELOAD / BACKEND_HOT_RELOAD). For production
# use docker-compose.prod.yml.

name: sourcebox

# Backend and worker are the same image and the same environment; only the command differs.
# Anchored so a change cannot be applied to one and forgotten on the other, which would put
# mismatched code in the request path and the queue.
x-backend: &backend
  build:
    context: ./backend
    target: development
  image: sourcebox-backend:dev
  env_file: .env
  environment:
    # Inside the compose network the database is reached by service name, overriding
    # whatever POSTGRES_HOST says in .env (which is for host-side tools).
    POSTGRES_HOST: postgres

    # Where the BROWSER should load JS modules from -- not where this container can reach
    # Vite. Rails renders these URLs into the HTML for the browser to fetch, so it must be
    # a host-side address. `http://frontend:5173` would resolve only inside Docker and fail
    # in the browser.
    #
    # Setting this also puts FrontendAssets::Manifest into dev-server mode, so it never
    # looks for a build manifest.
    VITE_DEV_SERVER_URL: http://localhost:${FRONTEND_PORT:-5173}
    # Rails injects the Vite client and React Refresh preamble when this is true.
    # Default false: see .env.example.
    FRONTEND_HOT_RELOAD: ${FRONTEND_HOT_RELOAD:-false}
    # Rails reloads application code between requests when this is true. Default false.
    # The worker still never reloads — see config/environments/development.rb.
    BACKEND_HOT_RELOAD: ${BACKEND_HOT_RELOAD:-false}
  volumes:
    # Source is mounted so edits are picked up without a rebuild.
    - ./backend:/rails
    # Anonymous volumes keep container-generated files off the host, where they would
    # collide with host-side tooling and slow the mount down.
    - backend_tmp:/rails/tmp
    - backend_log:/rails/log
  depends_on:
    postgres:
      condition: service_healthy

services:
  # --- DB ---------------------------------------------------------------
  postgres:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sourcebox}
      POSTGRES_USER: ${POSTGRES_USER:-sourcebox_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sourcebox_dev}
    volumes:
      # PostgreSQL 18 moved PGDATA to /var/lib/postgresql/18/docker, and the image declares
      # its volume at /var/lib/postgresql. Using the pre-18 /var/lib/postgresql/data here
      # would silently persist nothing -- the database would look fine until the first
      # restart.
      - postgres_data:/var/lib/postgresql
      # Creates the second (queue) database and enables pg_stat_statements. Runs only on
      # first initialisation of an empty data directory.
      - ./database/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports:
      # Bound to loopback, not 0.0.0.0: a database with a development password must not be
      # reachable from the local network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # `./dev` waits on this before touching the database, which is what makes a single
      # command reliable on a cold start.
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sourcebox_dev} -d ${POSTGRES_DB:-sourcebox}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- BE ---------------------------------------------------------------
  backend:
    <<: *backend
    command: bin/rails server -b 0.0.0.0 -p 3000
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      # /health, not /ready: this is liveness. /ready fails when the database is briefly
      # unavailable, which should remove an instance from a load balancer, not mark the
      # container broken.
      test: [ "CMD", "ruby", "-e", "require 'net/http'; exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/health')).code == '200' ? 0 : 1)" ]
      interval: 15s
      timeout: 10s
      start_period: 40s
      retries: 3

  # --- Worker -----------------------------------------------------------
  # A separate container, not a thread inside Puma. In-process job execution competes with
  # request handling for the GVL and dies with the web process, and it cannot be scaled or
  # restarted independently.
  worker:
    <<: *backend
    command: bin/jobs
    # No ports. A worker reachable over HTTP is a misconfiguration.
    healthcheck:
      test: [ "CMD", "bin/rails", "solid_queue:check" ]
      interval: 30s
      timeout: 15s
      start_period: 40s
      retries: 3

  # --- FE ---------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      target: development
    image: sourcebox-frontend:dev
    command: npm run dev
    environment:
      # Absolute URLs Vite emits for assets referenced from inside CSS and JS. Host-side
      # address, because the browser is what fetches them.
      VITE_DEV_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
      # Vite HMR + polling file watch. Default false: see .env.example.
      FRONTEND_HOT_RELOAD: ${FRONTEND_HOT_RELOAD:-false}
    volumes:
      - ./frontend:/app
      # A named volume, NOT a bind mount. node_modules is tens of thousands of tiny files;
      # served through virtiofs on macOS it turns a 2-second Vite boot into minutes. Docker
      # seeds this from the image on first use.
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    # No depends_on: the dev server compiles on demand and needs neither Rails nor the
    # database. Keeping it independent means a backend restart never interrupts HMR.
    healthcheck:
      # /@vite/client always exists while the dev server is up; / would 404 because this
      # project has no index.html (Rails renders the HTML).
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:5173/@vite/client').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  postgres_data:
  frontend_node_modules:
  backend_tmp:
  backend_log:
