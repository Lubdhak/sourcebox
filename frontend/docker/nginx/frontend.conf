# Static server for the frontend container.
#
# Serves the Vite build output and nothing else. It is not a reverse proxy and never talks
# to Rails: the HTML comes from the backend, and the asset URLs inside that HTML point
# here. Having no backend dependency is what lets this container start, scale and deploy on
# its own -- and be swapped for a CDN with no code change.
#
# Two kinds of resource are published:
#   /assets/*       content-hashed JS and CSS, cached forever
#   /manifest.json  the entry -> hashed-filename map the backend reads, never cached
#
# Listens on 8080 because the image is nginx-unprivileged: it runs as a non-root user that
# cannot bind a port below 1024.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;

    # --- Compression ---------------------------------------------------
    # JS is the bulk of the payload and compresses roughly 3-4x. Images and woff2 fonts are
    # already compressed, so recompressing them only burns CPU.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        application/javascript
        text/javascript
        application/json
        text/css
        image/svg+xml;

    # --- Health --------------------------------------------------------
    # Used by the container HEALTHCHECK, by `./dev`, and by the load balancer. Not logged:
    # probes would otherwise dominate the access log.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # --- Build manifest ------------------------------------------------
    # Fetched by the backend to resolve entry names to hashed filenames.
    #
    # Must NOT be cached: unlike the assets it points at, this file's contents change on
    # every deploy while its URL stays the same. A cached manifest would make the backend
    # render URLs for the previous build indefinitely.
    location = /manifest.json {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        default_type application/json;
        try_files $uri =404;
    }

    # --- Hashed build output -------------------------------------------
    location /assets/ {
        # Vite emits content-hashed filenames, so a given URL's contents can never change.
        # That is precisely what makes independent deploys safe: the old and new releases'
        # assets coexist, so a browser mid-session on the previous release keeps working
        # after the backend rolls forward.
        #
        # `immutable` tells the browser not to even send a revalidation request.
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # Required, not optional. The document is served by Rails while these assets come
        # from this origin, so every <script type="module"> and every webfont is a
        # cross-origin request. Module scripts are always fetched in CORS mode; without
        # these headers the browser blocks them and the page renders blank.
        #
        # `*` is right for public, non-credentialed static files, and must never be paired
        # with Access-Control-Allow-Credentials.
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        # Lets the browser expose real timings for these to the Navigation Timing API,
        # which the frontend logger reports.
        add_header Timing-Allow-Origin          "*" always;
        add_header X-Content-Type-Options       "nosniff" always;

        if ($request_method = OPTIONS) {
            add_header Content-Length 0;
            return 204;
        }

        try_files $uri =404;
    }

    # Sourcemaps are emitted next to the assets and are covered by the block above. They
    # are intentionally public: they make production stack traces readable, and the code
    # they describe is already shipped to the browser.

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # An asset server should not answer for anything else. A 404 makes a misrouted request
    # obvious, where an index fallback would silently serve the wrong thing.
    location / {
        return 404;
    }
}
