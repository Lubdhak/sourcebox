# Static asset server for the separately deployable frontend container.
#
# This container serves ONLY the Vite build output. It is not a reverse proxy and it
# never talks to Rails: HTML comes from the Rails container, and the asset URLs inside
# that HTML point here via ASSET_HOST. Keeping it proxy-free means it has no dependency
# on the backend and can scale, cache, or be replaced by a CDN independently.
#
# Listens on 8080 because the image is nginx-unprivileged, running as a non-root user
# that cannot bind a port below 1024.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root /usr/share/nginx/html;

    # Do not advertise the nginx version to the internet.
    server_tokens off;

    charset utf-8;

    # --- Compression ---------------------------------------------------
    # Text assets compress by roughly 3-4x, and JS is the bulk of the payload.
    # Images and fonts (woff2) are already compressed; recompressing them wastes CPU.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        application/javascript
        text/javascript
        application/json
        text/css
        image/svg+xml
        application/manifest+json;

    # --- Health --------------------------------------------------------
    # Used by the container HEALTHCHECK and by the load balancer. Deliberately not
    # logged: probes would otherwise dominate the access log.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # --- Hashed build output -------------------------------------------
    location /vite/ {
        # Vite emits content-hashed filenames, so a given URL's contents can never
        # change. That is what makes the frontend independently deployable: assets from
        # the old and new release coexist without colliding, so a browser mid-session on
        # the previous release keeps working after the backend rolls forward.
        #
        # `immutable` tells the browser not to even send a revalidation request.
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # Required, not optional. The HTML is served from the Rails origin while these
        # assets come from this one, so every <script type="module"> and every webfont is
        # a cross-origin request. Without CORS headers the browser blocks them and the
        # page renders unstyled with no JS.
        #
        # `*` is appropriate for public, non-credentialed static files. It must never be
        # paired with Access-Control-Allow-Credentials.
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Timing-Allow-Origin          "*" always;

        # Stops a browser from reinterpreting a .js file as something else.
        add_header X-Content-Type-Options "nosniff" always;

        # Cheap preflight.
        if ($request_method = OPTIONS) {
            add_header Content-Length 0;
            return 204;
        }

        try_files $uri =404;
    }

    # The Vite manifest lives in public/vite/.vite/. Rails reads it from its own
    # filesystem; nothing should fetch it over HTTP.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # An asset server should not answer for anything else. Returning 404 rather than
    # falling back to an index makes a misrouted request obvious instead of silently
    # serving the wrong thing.
    location / {
        return 404;
    }
}
